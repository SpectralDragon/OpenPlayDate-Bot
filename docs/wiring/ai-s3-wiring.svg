<text x="1452" y="728" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#202733" text-anchor="start">LED</text>
<rect x="1673" y="305" width="137" height="227" rx="5" fill="#263944" stroke="#263944" stroke-width="2"/>
<ellipse cx="1710" cy="405" rx="13" ry="26" fill="#cbece8"/><ellipse cx="1770" cy="405" rx="13" ry="26" fill="#cbece8"/>
<text x="1742" y="478" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle">240×320</text>
<text x="1455" y="778" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#a12436" text-anchor="start">J1 оставить разомкнутой.</text>
<text x="1455" y="814" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#566174" text-anchor="start">LED — постоянная подсветка.</text>
<text x="1230" y="906" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#202733" text-anchor="start">ПОКА ОСТАВИТЬ СВОБОДНЫМИ</text>
<text x="1230" y="948" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#566174" text-anchor="start">Экран: SDO (MISO), T_CLK, T_CS,</text>
<text x="1230" y="981" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#566174" text-anchor="start">T_DIN, T_DO, T_IRQ и все SD_*.</text>
<text x="1230" y="1035" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#566174" text-anchor="start">На фото U1 для тача не установлена.</text>
<text x="1230" y="1073" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#566174" text-anchor="start">Профиль ST7789, 240×320, BGR, инверсия выкл.</text>
<text x="1230" y="1107" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#a12436" text-anchor="start">*5Vin: выход от USB требует проверки IN-OUT.</text>
<text x="1230" y="1135" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#a12436" text-anchor="start">До подключения VCC измерь около 5 В! См. README.</text>
<rect x="60" y="1164" width="1780" height="210" rx="14" fill="#ffffff" stroke="#d6dce5" stroke-width="2"/>
<text x="88" y="1205" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#202733" text-anchor="start">ПЕРЕД ПОДКЛЮЧЕНИЕМ</text>
<text x="88" y="1246" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#202733" text-anchor="start">1. Питание всей сборки — одним USB-кабелем через AI-S3. Переставляй провода при отключённом USB.</text>
<text x="88" y="1284" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#202733" text-anchor="start">2. Все GND соединены. Повторяющиеся GND и 3V3 на рисунке — общие шины макетки.</text>
<text x="88" y="1322" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#202733" text-anchor="start">3. У каждой кнопки выбери выводы из разных пар: они соединяются только при нажатии. Проверь прозвонкой.</text>
<text x="60" y="1410" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#566174" text-anchor="start">GPIO 12 означает контакт с надписью «12». GPIO35–37 заняты PSRAM. На сигнальные выводы ESP32 не подавать 5 В.</text>
</svg>