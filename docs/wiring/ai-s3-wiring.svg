<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1430" viewBox="0 0 1900 1430" role="img" aria-label="Схема подключения AI-S3, экрана SPI, джойстика и двух кнопок">
<rect x="0" y="0" width="1900" height="1430" rx="0" fill="#f7f8fb" stroke="#f7f8fb" stroke-width="2"/>
<text x="60" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="43" font-weight="600" fill="#202733" text-anchor="start">Первый пульт робота</text>
<text x="60" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#566174" text-anchor="start">AI-S3 / ESP32-S3-WROOM-1 N16R8 • экран SPI 240×320 • джойстик • две кнопки</text>
<text x="60" y="151" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#566174" text-anchor="start">Контакты расположены условно. Подключай по надписям на платах, а не по месту на рисунке.</text>
