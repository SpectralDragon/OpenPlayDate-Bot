[platformio]
default_envs = robot-eyes

[env:robot-eyes]
platform = espressif32@6.10.0
board = ai-s3-n16r8
framework = arduino
board_build.filesystem = littlefs

; Board memory and partition settings live in boards/ai-s3-n16r8.json.
build_flags =
    ; Make the setup visible to the library itself as well as application files.
    -Iinclude
    -DBOARD_HAS_PSRAM
    ; Current connection: native USB/OTG (COM6). Use 0 for UART/CH343 logging.
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@6.21.5
upload_speed = 115200
; Native USB: use the ROM loader; the RAM upload stub was losing its connection.
upload_flags = --no-stub
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder

; If auto-detection fails, specify the real USB port (not a Bluetooth COM port):
; upload_port = COM5
; monitor_port = COM5

; Experimental faster SPI. The default robot-eyes profile uses 10 MHz.
; DMA is off in both profiles; opt in with -DROBOT_GB_DMA=1 only for diagnostics.
[env:robot-fast]
extends = env:robot-eyes
build_flags =
    ${env:robot-eyes.build_flags}
    -DROBOT_DISPLAY_SPI_HZ=40000000

; Persistent colour bars on every boot, for checking the display and its power.
; Normal robot-eyes remains the default environment.
[env:display-test]
extends = env:robot-eyes
build_flags =
    ${env:robot-eyes.build_flags}
    -DROBOT_DISPLAY_TEST_AT_BOOT=1

; Driver-independent controller identification. Requires SDO(MISO) -> GPIO13.
[env:display-id]
extends = env:robot-eyes
lib_ignore = TFT_eSPI
build_src_filter = -<*> +<display_probe.cpp>
build_flags =
    ${env:robot-eyes.build_flags}
    -DROBOT_DISPLAY_ID_ONLY=1

; Isolate display setup/wiring from TFT_eSPI and ESP32-S3 hardware SPI.
[env:display-soft-test]
extends = env:robot-eyes
lib_ignore = TFT_eSPI
lib_deps = adafruit/Adafruit ILI9341@1.6.4
build_src_filter = -<*> +<display_soft_test.cpp>
build_flags =
    ${env:robot-eyes.build_flags}
    -DROBOT_DISPLAY_SOFT_TEST=1

; Candidate for a larger 480x320 panel with 18-bit SPI colour.
[env:display-test-ili9488]
extends = env:display-test
build_flags =
    ${env:display-test.build_flags}
    -DROBOT_TFT_ILI9488=1
    -DROBOT_DISPLAY_SLOW_SPI=1

[env:display-test-st7789]
extends = env:display-test
build_flags =
    ${env:display-test.build_flags}
    -DROBOT_TFT_ST7789=1
    -DROBOT_DISPLAY_SLOW_SPI=1
